# Local development/reproduction environment.
# Usage: docker compose up --build
# Then: curl http://localhost:8080/health
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: minipay
      POSTGRES_USER: minipay
      POSTGRES_PASSWORD: minipay
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minipay -d minipay"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./app/minipay_api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: minipay
      DB_USER: minipay
      DB_PASSWORD: minipay
      MINIPAY_API_KEY: dev-local-key
      LOG_LEVEL: INFO
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
