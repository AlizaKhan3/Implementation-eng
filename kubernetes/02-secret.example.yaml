# TEMPLATE ONLY -- do not commit real values (see repo-wide rule: no
# passwords/tokens/PII in the submission).
#
# Create the real secret imperatively instead, e.g.:
#   kubectl create secret generic minipay-secrets -n minipay \
#     --from-literal=DB_USER=minipay \
#     --from-literal=DB_PASSWORD='<a real password, not this file>' \
#     --from-literal=MINIPAY_API_KEY='<a real random key>'
#
# This file documents the *shape* the Deployment expects, with obviously
# fake placeholder values, so a reviewer can see what's required without
# any real credential ever touching git history.
apiVersion: v1
kind: Secret
metadata:
  name: minipay-secrets
  namespace: minipay
type: Opaque
stringData:
  DB_USER: "CHANGE_ME"
  DB_PASSWORD: "CHANGE_ME"
  MINIPAY_API_KEY: "CHANGE_ME"
