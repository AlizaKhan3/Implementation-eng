name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r python/requirements.txt pytest
      - run: cd python && pytest tests/ -v

  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: minipay
          POSTGRES_USER: minipay
          POSTGRES_PASSWORD: minipay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U minipay -d minipay"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load schema
        run: PGPASSWORD=minipay psql -h localhost -U minipay -d minipay -f database/schema.sql
      - name: Install API deps
        run: pip install -r app/minipay_api/requirements.txt
      - name: Start API
        env:
          DB_HOST: localhost
          DB_USER: minipay
          DB_PASSWORD: minipay
          DB_NAME: minipay
          MINIPAY_API_KEY: ci-test-key
        run: |
          cd app && nohup python -m uvicorn minipay_api.main:app --host 0.0.0.0 --port 8080 &
          for i in $(seq 1 20); do curl -sf http://localhost:8080/health && break; sleep 1; done
      - name: Install test deps
        run: pip install -r tests/api/requirements.txt 2>/dev/null || pip install pytest requests psycopg2-binary
      - name: Run API tests (fast gate)
        env:
          MINIPAY_API_URL: http://localhost:8080
          MINIPAY_API_KEY: ci-test-key
          DB_HOST: localhost
          DB_USER: minipay
          DB_PASSWORD: minipay
          DB_NAME: minipay
        run: cd tests/api && pytest -v

  ui-smoke-tests:
    runs-on: ubuntu-latest
    needs: api-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: minipay
          POSTGRES_USER: minipay
          POSTGRES_PASSWORD: minipay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U minipay -d minipay"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PGPASSWORD=minipay psql -h localhost -U minipay -d minipay -f database/schema.sql
      - run: pip install -r app/minipay_api/requirements.txt
      - env:
          DB_HOST: localhost
          DB_USER: minipay
          DB_PASSWORD: minipay
          DB_NAME: minipay
          MINIPAY_API_KEY: ci-test-key
        run: |
          cd app && nohup python -m uvicorn minipay_api.main:app --host 0.0.0.0 --port 8080 &
          for i in $(seq 1 20); do curl -sf http://localhost:8080/health && break; sleep 1; done
      - run: pip install -r tests/ui/requirements.txt && playwright install --with-deps chromium
      - name: Run smoke-tier UI journeys only (see tests/ui/NOTES.md for the full-vs-fast split)
        env:
          MINIPAY_UI_URL: http://localhost:8080
          MINIPAY_API_KEY: ci-test-key
        run: |
          cd tests/ui && pytest -v --browser chromium \
            -k "test_login_with_valid_key_succeeds or test_search_existing_transaction_shows_result or test_submit_payment_shows_success_result"
